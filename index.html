<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>یادینو</title>
<link rel="icon" href="yadino-logo.png" type="image/png">

<style>
body{
    margin:0;
    font-family:tahoma,sans-serif;
    background:#111;
    color:white;
}

header{
    background:#000;
    padding:20px;
    text-align:center;
}

.container{
    max-width:900px;
    margin:auto;
    padding:30px;
    text-align:center;
}

.card{
    background:#1c1c1c;
    padding:20px;
    border-radius:15px;
    margin-top:20px;
}

input{
    width:90%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

.btn{
    background:#00aaff;
    color:white;
}

.menu a{
    display:inline-block;
    margin:10px;
    padding:12px 20px;
    background:#00aaff;
    color:white;
    text-decoration:none;
    border-radius:8px;
}
</style>
</head>

<body>

<header>
    <h1>🎓 یادینو</h1>
    <p>به سایت آموزشی یادینو خوش آمدید</p>
</header>

<div class="container">

    <div class="card">
        <h2>ثبت نام</h2>

        <form id="signup-form">
            <input type="email" placeholder="ایمیل" required>
            <input type="password" placeholder="رمز عبور" required>
            <br>
            <button class="btn" type="submit">ثبت نام</button>
        </form>

        <p id="status"></p>
    </div>

    <div class="card">
        <h2>بخش‌های سایت</h2>

        <div class="menu">
            <a href="lessons.html">آموزش‌ها</a>
            <a href="admin.html">پنل مدیریت</a>
        </div>
    </div>

</div>

<script>
document.getElementById("signup-form")
.addEventListener("submit",function(e){
e.preventDefault();
document.getElementById("status").innerText =
"✅ ثبت نام با موفقیت انجام شد";
});
</script>

</body>
</html>
